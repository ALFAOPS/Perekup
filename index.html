<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#141118">
<link rel="icon" href="icon-512.png">
<style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}html,body{margin:0;height:100%;box-sizing:border-box;overscroll-behavior:none}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Перекуп</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Golos+Text:wght@400;600;800&family=PT+Serif:ital,wght@0,700;1,700&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head><body><style>
/* Layout: пиксельная комната во весь экран (canvas), сверху HUD с деньгами и потребностями, снизу строка подсказки.
   Объекты комнаты открывают пиксельные панели; компьютер — ЭЛТ-монитор с ретро-ОС и сайтами площадок. Одна тёмная «ночная» палитра намеренно. */
:root{
  --bg:#141118; --pbg:#26212e; --pbg2:#332c3d; --line:#0b090e; --fg:#f2e9d8; --mut:#a99db5;
  --acc:#ffc93c; --acc2:#d98b14; --acc3:#ffe7a0; --red:#e5533d; --grn:#74d36b; --blu:#5ea8ff;
  --win:#ece6d6; --win2:#d8d0bb; --wink:#2a2335; --wtx:#1d1a22;
  --fp:'Press Start 2P',ui-monospace,monospace; --fu:'Golos Text',system-ui,-apple-system,sans-serif;
  --fw:'Golos Text',system-ui,-apple-system,sans-serif; --fs:'PT Serif',Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--fu);font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--blu);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
#app{height:100%;display:flex;flex-direction:column;position:relative}
.hud-in,.hint-in{max-width:760px;margin-left:auto!important;margin-right:auto!important}

/* pixel kit */
.pb{background:var(--pbg);box-shadow:0 -4px 0 0 var(--line),0 4px 0 0 var(--line),-4px 0 0 0 var(--line),4px 0 0 0 var(--line),inset 0 4px 0 0 rgba(255,255,255,.07),inset 0 -4px 0 0 rgba(0,0,0,.28)}
.pbtn{font-family:var(--fp);font-size:9px;line-height:1.5;letter-spacing:.02em;color:#2a1a05;background:var(--acc);padding:10px 12px 9px;margin:3px;text-align:center;
  box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line),inset 0 -4px 0 0 var(--acc2),inset 0 3px 0 0 var(--acc3)}
.pbtn:active{transform:translateY(2px);box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line),inset 0 4px 0 0 var(--acc2)}
.pbtn.alt{background:#5b5169;color:var(--fg);box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line),inset 0 -4px 0 0 #3f3750,inset 0 3px 0 0 #7a6f8a}
.pbtn.grn{background:var(--grn);box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line),inset 0 -4px 0 0 #3f9a3a,inset 0 3px 0 0 #b6f2a8}
.pbtn.red{background:var(--red);color:#fff;box-shadow:0 -3px 0 0 var(--line),0 3px 0 0 var(--line),-3px 0 0 0 var(--line),3px 0 0 0 var(--line),inset 0 -4px 0 0 #a8321f,inset 0 3px 0 0 #ff9a85}
.pbtn:disabled{filter:grayscale(1) brightness(.55);transform:none}
.pbtn small{display:block;font-family:var(--fu);font-size:13px;letter-spacing:0;margin-top:3px;opacity:.85}
.spr{image-rendering:pixelated;display:block}

/* HUD */
#hud{padding-block:8px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:5}
.hud-in{padding:10px 12px 10px;margin:4px}
.hrow{display:flex;align-items:center;gap:10px}
.money{display:flex;align-items:center;gap:6px;font-family:var(--fp);font-size:14px;flex:1;overflow:hidden;color:var(--acc);white-space:nowrap;min-width:0}
.money small{font-size:10px;color:var(--fg)}
.coin{width:18px;height:18px;flex:none}
.clk{flex:none;text-align:right;font-family:var(--fp);font-size:8px;line-height:1.8;color:var(--mut);white-space:nowrap}
.clk b{color:var(--fg);font-weight:400}
.clk .st{color:var(--acc)}
.phonebtn{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center;background:var(--pbg2);box-shadow:0 0 0 3px var(--line),inset 0 -3px 0 0 rgba(0,0,0,.35)}
.phonebtn img{width:30px;height:30px}
.sndbtn{width:36px;font-family:var(--fp);font-size:14px;color:var(--acc)}
.dot{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;padding:0 5px;background:var(--red);color:#fff;font-family:var(--fp);font-size:8px;display:grid;place-items:center;box-shadow:0 0 0 3px var(--line)}
.needs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.nd .l{display:flex;justify-content:space-between;font-family:var(--fp);font-size:7px;color:var(--mut);margin-bottom:4px;white-space:nowrap}
.nd .l b{color:var(--fg);font-weight:400}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;height:8px;background:var(--line);padding:1px}
.seg i{background:#3b3446}
.seg i.on{background:var(--grn)}
.nd.mid .seg i.on{background:var(--acc)}
.nd.low .seg i.on{background:var(--red)}
.nd.low{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
.goal{display:flex;align-items:center;gap:8px;margin-top:10px;font-family:var(--fp);font-size:7px;color:var(--mut);white-space:nowrap}
.goal .ch{color:var(--acc)}
.gbar{flex:1;height:8px;background:var(--line);padding:1px}
.gbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--acc) 0 6px,var(--acc2) 6px 8px);transition:width .5s steps(8)}

/* stage */
#stage{flex:1;position:relative;display:grid;place-items:center;overflow:hidden;min-height:0;
  background:radial-gradient(ellipse at 50% 40%,#221d29,#120f15 70%)}
#cv{image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:pointer;touch-action:none}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.flt{position:absolute;font-family:var(--fp);font-size:12px;color:var(--grn);text-shadow:2px 2px 0 var(--line);animation:flt 1.4s steps(14) forwards;white-space:nowrap}
.flt.neg{color:var(--red)}
@keyframes flt{to{transform:translateY(-56px);opacity:0}}
.lbl{position:absolute;font-family:var(--fp);font-size:8px;background:var(--line);color:var(--acc);padding:5px 7px;transform:translate(-50%,-100%);white-space:nowrap;animation:lbl 1s steps(5) forwards}
@keyframes lbl{0%,70%{opacity:1}100%{opacity:0}}
#hint{padding-block:4px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hint-in{margin:4px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:15px;line-height:1.3;min-height:52px}
.hint-in .ar{font-family:var(--fp);font-size:10px;color:var(--acc);animation:blink 1s steps(2) infinite;flex:none}

/* toasts */
#toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:60;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{max-width:520px;width:100%;padding:10px 12px;font-size:15px;line-height:1.35;animation:tin .25s steps(5)}
.toast.good{background:#1f3a24}.toast.bad{background:#47201b}
.toast b{color:var(--acc);font-weight:600}
@keyframes tin{from{transform:translateY(-14px);opacity:0}}

/* RPG panels (объекты комнаты) */
.ovl{position:fixed;inset:0;z-index:20;background:rgba(8,6,10,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:fade .15s}
@keyframes fade{from{opacity:0}}
.rp{width:100%;max-width:560px;max-height:78vh;display:flex;flex-direction:column;animation:up .2s steps(4)}
@keyframes up{from{transform:translateY(24px)}}
.rp-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:4px solid var(--line);background:var(--pbg2)}
.rp-h img{width:30px;height:30px}
.rp-h h3{margin:0;font-family:var(--fp);font-weight:400;font-size:11px;line-height:1.4;color:var(--acc);flex:1}
.rp-h .x{font-family:var(--fp);font-size:12px;width:36px;height:36px;background:var(--red);color:#fff;box-shadow:0 0 0 3px var(--line),inset 0 -3px 0 #a8321f}
.rp-b{overflow:auto;padding:6px 14px 14px}
.rp-b p{margin:10px 0;line-height:1.4;color:var(--mut);font-size:15px}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:2px dashed #3d3549}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:16px;line-height:1.2}
.row .t span{display:block;font-size:13.5px;color:var(--mut);line-height:1.35;margin-top:2px}
.row .em{font-size:26px;width:36px;text-align:center;flex:none}
.row .bt{display:flex;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:56%}
.tagline{font-family:var(--fp);font-size:8px;color:var(--acc);margin:14px 0 4px}
.pos{color:var(--grn)}.neg{color:var(--red)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:2px dashed #3d3549;font-size:15px}
.kv span:last-child{font-family:var(--fp);font-size:10px;white-space:nowrap;align-self:center}
.meter{display:grid;grid-template-columns:90px 1fr 34px;gap:10px;align-items:center;padding:6px 0;font-size:15px}
.meter .seg{height:12px}
.meter .v{font-family:var(--fp);font-size:9px;text-align:right}
.warnbox{margin-top:10px;padding:10px 12px;background:#47201b;box-shadow:0 0 0 3px var(--red);font-size:14.5px;line-height:1.4}

/* story dialog */
#story{position:fixed;inset:0;z-index:45;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));background:rgba(8,6,10,.45)}
.sd{width:100%;max-width:560px;display:grid;grid-template-columns:84px 1fr;gap:14px;padding:14px;cursor:pointer;animation:up .2s steps(4)}
.sd .pt{width:84px;height:84px;background:#4d6b8a;box-shadow:0 0 0 4px var(--line),inset 0 -6px 0 rgba(0,0,0,.25);display:grid;place-items:end center;overflow:hidden}
.sd .pt img{width:84px;height:84px}
.sd .nm{font-family:var(--fp);font-size:9px;color:var(--acc);margin-bottom:8px}
.sd .tx{font-size:16px;line-height:1.5;min-height:96px}
.sd .tx b{color:var(--acc);font-weight:600}
.sd .nx{grid-column:2;text-align:right;font-family:var(--fp);font-size:9px;color:var(--mut)}
.sd .nx i{font-style:normal;color:var(--acc);animation:blink .8s steps(2) infinite}
.chapcard{grid-column:1/-1;font-family:var(--fp);font-size:9px;color:var(--mut);display:flex;justify-content:space-between;border-bottom:3px solid var(--line);padding-bottom:10px}
.chapcard b{color:var(--acc);font-weight:400}

/* computer */
#os{position:fixed;inset:0;z-index:25;background:#0b090d;display:flex;align-items:stretch;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 10px) max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px));animation:fade .2s}
.crt{width:100%;max-width:640px;display:flex;flex-direction:column;background:linear-gradient(#d6ccb2,#c4b99c);border-radius:22px;padding:14px 14px 10px;box-shadow:inset 0 3px 0 #ece4cc,inset 0 -6px 0 #a89c7d,0 20px 50px rgba(0,0,0,.7)}
.screen{flex:1;min-height:0;position:relative;border-radius:16px/22px;overflow:hidden;background:#1a3b3a;box-shadow:0 0 0 6px #2b2620,inset 0 0 0 2px #000;animation:crton .35s ease-out}
@keyframes crton{0%{transform:scaleY(.01);filter:brightness(3)}60%{transform:scaleY(1);filter:brightness(1.6)}100%{filter:none}}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(rgba(0,0,0,.09) 0 1px,transparent 1px 3px),radial-gradient(ellipse at 50% 50%,transparent 60%,rgba(0,0,0,.45));border-radius:inherit}
.bezel{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 0;font-family:var(--fp);font-size:7px;color:#6d6450}
.bezel .led{width:8px;height:8px;background:#5dff6a;box-shadow:0 0 8px #5dff6a;display:inline-block;margin-right:6px}
.bezel button{font-family:var(--fp);font-size:8px;color:#4a4232;background:#b5aa8c;padding:8px 10px;box-shadow:inset 0 -3px 0 #8f8468,inset 0 2px 0 #ddd3b8;border-radius:4px}
.desk{position:absolute;inset:0 0 38px;padding:18px 14px;background:
  linear-gradient(rgba(0,0,0,.0),rgba(0,0,0,.25)),
  repeating-conic-gradient(#1f4a48 0 25%,#1c4341 0 50%) 0 0/4px 4px;
  display:grid;grid-template-columns:repeat(3,1fr);align-content:start;gap:18px 6px}
.desk .logo{position:absolute;right:14px;bottom:14px;font-family:var(--fp);font-size:10px;color:rgba(255,255,255,.13);text-align:right;line-height:1.6}
.ico{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px;position:relative}
.ico img{width:44px;height:44px}
.ico span{font-family:var(--fp);font-size:7.5px;line-height:1.5;color:#fff;background:rgba(0,0,0,.45);padding:3px 5px;text-align:center}
.ico:active span{background:#2846b5}
.ico .dot{top:-2px;right:calc(50% - 34px)}
.task{position:absolute;left:0;right:0;bottom:0;height:38px;background:var(--wink);display:flex;align-items:center;gap:8px;padding:0 8px;border-top:3px solid #4b4060;z-index:3}
.task .start{font-family:var(--fp);font-size:8px;background:var(--acc);color:#2a1a05;padding:7px 9px;box-shadow:inset 0 -3px 0 var(--acc2)}
.task .ap{font-family:var(--fp);font-size:7.5px;color:var(--fg);background:#3e3352;padding:7px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.task .tm{margin-left:auto;font-family:var(--fp);font-size:8px;color:var(--acc);white-space:nowrap}
.win{position:absolute;inset:6px 6px 44px;background:var(--win);color:var(--wtx);display:flex;flex-direction:column;box-shadow:0 0 0 3px #000,6px 6px 0 rgba(0,0,0,.35);animation:wopen .18s steps(3)}
@keyframes wopen{from{transform:scale(.92);opacity:.4}}
.win .tb{display:flex;align-items:center;gap:8px;background:var(--wink);color:var(--acc);padding:6px 6px 6px 10px;font-family:var(--fp);font-size:8px;flex:none}
.win .tb span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win .tb button{width:28px;height:24px;background:var(--red);color:#fff;font-family:var(--fp);font-size:9px;box-shadow:inset 0 -3px 0 #a8321f}
.win .wc{flex:1;overflow:auto;font-family:var(--fw);font-size:14px;-webkit-user-select:text;user-select:text;position:relative}
.wpad{padding:12px}
.wh{font-family:var(--fp);font-size:10px;line-height:1.5;margin:4px 0 10px;color:var(--wink)}
.wp{margin:0 0 12px;line-height:1.45;color:#4c4555;font-size:14px}

/* browser */
.addr{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--win2);border-bottom:2px solid #b9b09a;position:sticky;top:0;z-index:2}
.addr .u{flex:1;background:#fff;border:2px solid #8f8670;padding:5px 8px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk{font-family:var(--fp);font-size:8px;padding:7px 8px;background:#cfc6ae;box-shadow:inset 0 -3px 0 #a99e82}
.ptabs{display:flex;gap:4px;overflow-x:auto;padding:6px 8px 0;background:var(--win2);position:sticky;top:42px;z-index:2;scrollbar-width:none}
.ptabs::-webkit-scrollbar{display:none}
.ptab{flex:none;font-family:var(--fw);font-size:12.5px;font-weight:600;padding:7px 10px;background:#c9bfa6;border-radius:8px 8px 0 0;display:flex;align-items:center;gap:6px;color:#3a3340;white-space:nowrap}
.ptab i{width:9px;height:9px;border-radius:50%;background:var(--pc)}
.ptab.on{background:#fff;color:#111}
.ptab.lock{opacity:.6}
.site{--pc:#4caf50;background:#f5f5f2;min-height:100%}
.sh{background:var(--pc);color:#fff;padding:14px 14px 0}
.sh .lg{font-size:24px;line-height:1.1}
.sh .sl{font-size:12.5px;opacity:.9;margin:4px 0 10px}
.snav{display:flex;gap:2px}
.snav button{font-family:var(--fw);font-size:13px;font-weight:600;padding:8px 12px;color:rgba(255,255,255,.85);border-radius:8px 8px 0 0}
.snav button.on{background:#f5f5f2;color:#111}
.s-bar .lg{font-family:var(--fw);font-weight:800;letter-spacing:-.04em;text-transform:lowercase}
.s-bar .lg em{font-style:normal;background:#fff;color:var(--pc);padding:0 5px;border-radius:5px;margin-left:2px}
.s-tech .lg{font-family:var(--fp);font-size:16px;letter-spacing:.02em}
.s-tech .lg em{font-style:normal;color:#7ee0ff}
.s-shm .lg{font-family:var(--fs);font-style:italic;font-size:28px}
.s-rar .sh{background:linear-gradient(#7a5426,#5f3f1b);border-bottom:3px double #e8c77a}
.s-rar .lg{font-family:var(--fs);font-weight:700;letter-spacing:.18em;font-size:22px;color:#f3dfa8}
.s-auto .sh{background:repeating-linear-gradient(45deg,#111 0 10px,#222 10px 20px)}
.s-realty .sh{background:linear-gradient(135deg,#0f6e63,#13897a)}
.s-realty .lg{font-family:var(--fw);font-weight:800;letter-spacing:.08em;font-size:21px}.s-realty .lg em{font-style:normal;color:#ffe08a}
.s-auto .lg{font-family:var(--fw);font-weight:800;font-style:italic;letter-spacing:.02em;color:#ff8a3c;font-size:26px}
.lot{display:grid;grid-template-columns:92px 1fr;gap:10px;background:#fff;border-radius:10px;padding:10px;margin:10px;box-shadow:0 1px 3px rgba(0,0,0,.15);position:relative}
.lot.rare{box-shadow:0 0 0 3px #e2b33c,0 4px 14px rgba(200,140,0,.35);background:#fffbea}
.lot .n{font-weight:600;font-size:15px;line-height:1.25}
.lot .pr{font-weight:800;font-size:19px;margin:3px 0 2px}
.lot .pr s{font-weight:400;font-size:13px;color:#999;margin-left:6px}
.lot .m{font-size:12.5px;color:#777;line-height:1.35}
.lot .q{font-size:13px;color:#555;font-style:italic;margin-top:3px}
.lot .es{font-size:12.5px;margin-top:4px}
.lot .es b{padding:1px 5px;border-radius:4px;background:#dff5d6;color:#1d7a32}
.lot .es b.neg{background:#ffe0da;color:#b52b17}
.lot .dl{font-size:12px;margin-top:3px;color:#666}
.lot .dl.fee{color:#a14b00;font-weight:600}
.lot .ins{font-size:13px;font-weight:600;margin-top:4px}
.ins.ok{color:#1d7a32}.ins.bad{color:#b52b17}.ins.meh{color:#2846b5}
.lot .ba{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.lot .tl{position:absolute;left:10px;right:10px;bottom:4px;height:3px;background:#eee;border-radius:2px;overflow:hidden}
.lot .tl i{display:block;height:100%;background:var(--pc);transition:width 1s linear}
.badge{position:absolute;top:8px;right:8px;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:5px;background:#ff7a1f;color:#fff;letter-spacing:.04em}
.badge.gold{background:#e2b33c;color:#3a2600}
.badge.on{background:#2ea043}
.wbtn{font-family:var(--fw);font-weight:600;font-size:13.5px;padding:9px 13px;border-radius:8px;background:#ebe8e2;color:#222}
.wbtn.pri{background:var(--pc);color:#fff}
.wbtn.dk{background:#222;color:#fff}
.wbtn:disabled{opacity:.4}

// фоновая музыка: Am–F–C–G, мягкий чиптюн
const PROG=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
const MELO=[76,null,null,74,72,null,74,null,72,null,69,null,null,null,null,null,72,null,null,74,76,null,79,null,74,null,null,null,71,null,null,null];
let mStep=0,mNext=0;const mf=m=>440*Math.pow(2,(m-69)/12);
function musicTick(){if(!AC||sndMode!==0||document.hidden||AC.state!=='running')return;const spb=60/88/2;const nv=typeof night==='function'&&night()?.55:1;if(mNext<AC.currentTime)mNext=AC.currentTime+.05;
  while(mNext<AC.currentTime+.4){const bar=Math.floor(mStep/8)%4,st=mStep%8,ch=PROG[bar],at=mNext-AC.currentTime;
    if(st%4===0)tone(mf(ch[0]-12),spb*3.6,{type:'triangle',v:.1*nv,at,g:musicGain});
    tone(mf(ch[[0,1,2,1,0,2,1,2][st]]+12),spb*.85,{type:'square',v:.016*nv,at,g:musicGain});
    const ml=MELO[mStep%32];if(ml!=null&&Math.floor(mStep/32)%2===0)tone(mf(ml),spb*1.9,{type:'triangle',v:.045*nv,at,g:musicGain});
    if(st===4)nz(.03,{v:.02*nv,f:7000,type:'highpass',at});
    mNext+=spb;mStep++}}
setInterval(musicTick,100);

const BOXOF=id=>Object.keys(BOXT).find(k=>BOXT[k].tpl===id);
function boxRoll(type,noRare){
  const B=BOXT[type],tm=tierMax();let pool=TPL.filter(x=>!x.rare&&x.t<=tm&&B.pool(x));if(!pool.length)pool=TPL.filter(x=>!x.rare&&x.t===0&&x.s===0);
  const n=B.cnt[0]+Math.floor(R()*(B.cnt[1]-B.cnt[0]+1));const out=[];
  for(let i=0;i<n;i++){
    if(!noRare&&R()<B.rare){const cap=B.cap||60000*SCALE();const rp=TPL.filter(x=>x.rare&&!x.lotd&&!x.bx&&x.s<=1&&x.a<=cap);if(rp.length){const t=pick(rp);out.push({tpl:t.id,ci:1,v:round(rnd(t.a,t.b)),rare:1});continue}}
    if(R()<B.junk){out.push({junk:pick(JUNK)});continue}
    const w=pool.map(x=>1/Math.sqrt(x.a));let r=R()*w.reduce((a,b)=>a+b,0),t=pool[0];for(let j=0;j<pool.length;j++){r-=w[j];if(r<=0){t=pool[j];break}}
    const ci=B.ci[0]+Math.floor(R()*(B.ci[1]-B.ci[0]+1));out.push({tpl:t.id,ci,v:round(rnd(t.a,t.b)*COND[ci][1])})}
  return out;
}

function openBox(it){

const iconCache={};
function iconCanvas(id){if(iconCache[id])return iconCache[id];let a=ITEMART[id]||'box';let acc='#7a7a8a';if(Array.isArray(a)){acc=a[1];a=a[0]}
  const rows=ART[a]||ART.box;const c=document.createElement('canvas');c.width=16;c.height=16;const g=c.getContext('2d');
  const pal=Object.assign({},IPAL2,{x:acc});
  rows.forEach((r,y)=>{for(let x=0;x<Math.min(16,r.length);x++){const ch=r[x];if(ch!=='.'&&ch!==' '&&pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1)}}});
  // мягкий блик
  g.globalCompositeOperation='source-atop';g.fillStyle='rgba(255,255,255,.12)';g.fillRect(0,0,16,6);
  iconCache[id]=c;return c}

let parts=[];
function spawn(o){if(parts.length<260)parts.push(Object.assign({vx:0,vy:0,life:1,max:1,size:.5,col:'#fff',g:0,kind:'dot'},o))}
function spawnCoins(x,y){for(let i=0;i<14;i++){const a=Math.random()*Math.PI-Math.PI;spawn({x,y:y-12,vx:Math.cos(a)*rnd(10,26),vy:Math.sin(a)*rnd(18,36),g:70,life:1.2,max:1.2,size:1.5,col:'#f2c230',kind:'coin'})}}
const weather=()=>{const hs=(S.news||[]).map(n=>n.h).join(' ');return /Ливень/.test(hs)?'rain':/Снегопад|морозы/.test(hs)?'snow':null};
let lastPT=performance.now(),emitT={};
function emit(key,every,fn){const now=performance.now();if(!emitT[key]||now-emitT[key]>every){emitT[key]=now;fn()}}
function updateParts(dt){for(const p of parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}parts=parts.filter(p=>p.life>0)}
function drawParts(){
  for(const p of parts){const a=Math.max(0,Math.min(1,p.life/p.max));
    if(p.kind==='coin'){cx.globalAlpha=a;P(p.x-.75,p.y-.75,1.5,1.5,'#f2c230');P(p.x-.25,p.y-.75,.5,.5,'#fff3b0');cx.globalAlpha=1}
    else if(p.kind==='rain'){cx.strokeStyle='rgba(170,200,255,.55)';cx.lineWidth=.5;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-1,p.y+3);cx.stroke()}
    else if(p.kind==='leaf'){cx.globalAlpha=a;P(p.x,p.y,1,.5,p.col);cx.globalAlpha=1}
    else{cx.globalAlpha=a*(p.alpha||1);P(p.x-p.size/2,p.y-p.size/2,p.size,p.size,p.col);cx.globalAlpha=1}}
}
function ambient(now){
  const w=weather();
  if(S.scene!=='home'&&S.scene!=='shop'){
    if(w==='rain')for(let i=0;i<3;i++)spawn({x:rnd(-OX,W+OX),y:-4,vx:-14,vy:120,life:1.6,max:1.6,kind:'rain'});
    if(w==='snow')emit('snow',60,()=>spawn({x:rnd(-OX,W+OX),y:-2,vx:rnd(-4,4),vy:rnd(10,18),life:12,max:12,size:1,col:'#ffffff',alpha:.9}));
  }
  if(S.scene==='home'){
    emit('steam',380,()=>spawn({x:8+rnd(-.5,.5),y:35,vx:rnd(-1,1),vy:-6,life:2,max:2,size:1,col:'#ffffff',alpha:.45}));
    if(darkness()<.2)emit('mote',500,()=>spawn({x:rnd(60,100),y:rnd(40,110),vx:rnd(-1.5,1.5),vy:rnd(-1,1),life:5,max:5,size:.5,col:'#fff6c0',alpha:.8}));
  }

}

function inBlock(x,y){return sceneDef(S.scene).block.some(([bx,by,bw,bh])=>x>=bx&&x<bx+bw&&y>=by&&y<by+bh)}
function segOK(a,b){for(let i=0;i<=24;i++){const x=a[0]+(b[0]-a[0])*i/24,y=a[1]+(b[1]-a[1])*i/24;if(inBlock(x,y))return false}return true}
function walkTo(x,y,obj){
  const d=sceneDef(S.scene);const y1=d.y1||H-4;
  x=Math.max(4,Math.min(124,x));y=Math.max(d.y0,Math.min(y1,y));
  if(inBlock(x,y)&&!obj)return;
  const a=[me.x,me.y],b=[x,y];
  me.path=segOK(a,b)?[b]:[d.way,b];me.moving=true;me.pend=obj||null;
}
function update(dt){
  if(!me.moving)return;
  const tgt=me.path[0];if(!tgt){me.moving=false;return}
  const dx=tgt[0]-me.x,dy=tgt[1]-me.y,d=Math.hypot(dx,dy),sp=50*dt;
  if(Math.abs(dx)>Math.abs(dy))me.dir=dx>0?'right':'left';else me.dir=dy>0?'down':'up';
  if(d<=sp){me.x=tgt[0];me.y=tgt[1];me.path.shift();if(!me.path.length){me.moving=false;if(me.pend){const o=me.pend;me.pend=null;me.dir=o.face;openObj(o.id)}}}
  else{me.x+=dx/d*sp;me.y+=dy/d*sp;me.acc=(me.acc||0)+sp;if(me.acc>7){me.acc=0;sfx('step')}}
}

    <div class="tl"><i data-ct="${c.id}" style="width:${c.ttl/c.max*100}%"></i></div></div>`}

    case 'crul':casPlay('rul',id);return;
    case 'under':if(it&&it.under){it.price=round(it.under.p*.96);S.stats.beat=(S.stats.beat||0)+1;it.boost=20;sfx('good');toast(`😎 Перебил Жеку: «${it.n}» теперь ${fmt(it.price)} ₽. Покупатели снова твои.`,'good')}break;
    case 'fsend':if(c&&citem){removeItem(citem);S.stats.scammed=(S.stats.scammed||0)+1;mood(-15);sfx('err');log(`Фейковый перевод: потерял ${citem.n}`);toast(`🚩 Отправил «${citem.n}»… а денег на карте нет. Скриншот был фейковый.`,'bad');scamTip()}break;
    case 'fchk':if(c){S.chats=S.chats.filter(x=>x!==c);S.stats.dodged=(S.stats.dodged||0)+1;mood(4);toast('🕵️ Проверил банк — перевода нет, скрин нарисован. Кидала в ЧС.','good')}break;
    case 'rej':if(c)S.chats=S.chats.filter(x=>x!==c);break;
    case 'ping':if(c){if(citem){citem.boost=40;toast(`Ответил ${c.who}. «${citem.n}» продастся быстрее.`)}S.chats=S.chats.filter(x=>x!==c)}break;
    case 'swap':if(c&&citem&&c.swap){const t=tplOf(c.swap.tpl);S.chats=S.chats.filter(x=>x.item!==citem.id);const ni=newItem(t,1,c.swap.v,{fake:R()<(t.fk??.05),paid:citem.paid});S.inv[S.inv.indexOf(citem)]=ni;log(`Обменял ${citem.n} на ${t.n}`);toast(`🔄 Обмен: теперь у тебя <b>${t.n}</b>`,'good')}break;
    case 'ful':if(ord){const mt=orderMatch(ord);if(mt.length&&spend(enCost({tpl:ord.tpl}))){pass(6);fulfil(ord,mt[0])}}break;
    case 'ordx':if(ord){S.orders=S.orders.filter(x=>x!==ord);S.rep=Math.max(0,S.rep-1);toast('Отказался от заказа. −1 репутации.')}break;
    case 'up':{const u=UP.find(x=>x.id===id),cc=upCost(u);if(S.money>=cc&&S.up[id]<MAXL){S.money-=cc;S.up[id]++;mood(5);toast(`📚 ${u.n}: модуль ${S.up[id]} пройден`,'good');log(`Курс «${u.n}» → ${S.up[id]}`)}break}
    case 'eatf':{const g=GROC.find(x=>x.id===id);if(g&&S.fridge[id]>0){S.fridge[id]--;applyF(g);pass(5);sfx('eat');toast(`🍽 ${g.n}. ${eff(g)}`)}break}
    case 'groc':{const g=GROC.find(x=>x.id===id);if(g&&pay(g.p)){S.fridge[id]=(S.fridge[id]||0)+1;toast(`🛒 ${g.n} → в холодильник`)}break}
    case 'deliv':{const f=DELIV.find(x=>x.n===id);if(f&&pay(f.p)){pass(8);applyF(f);sfx('eat');toast(`🛵 ${f.n} приехала. ${eff(f)}`)}break}
    case 'buyF':{const m={pharm:[900,{hp:30}],cold:[350,{hp:12,m:4}],cap:[200,{e:12,m:3}],en:[120,{e:24,hp:-7}],cro:[180,{h:20,m:4}]}[id];if(m&&pay(m[0])){applyF(m[1]);pass(3);toast(`✔ ${eff(m[1])}`)}break}
    case 'trip':{const T={walk:[0,22,{m:16,e:-6}],cinema:[600,45,{m:22,e:-5}],banya:[1500,45,{m:40,e:15,hp:5}],sea:[250000,0]}[id];if(!T||!pay(T[0]))break;
      if(id==='sea'){closeAll();applyF({m:100,e:100,hp:50,h:60});skip(7*360,0,'Море','Неделя у моря. Телефон выключен, Валера присмотрел за стеллажом.');return}
      pass(T[1]);applyF(T[2]);toast({walk:'🌊 Прогулялся по набережной. Голова проветрилась.',cinema:'🎬 Сходил в кино с друзьями.',banya:'🧖 Баня с Валерой. Как заново родился.'}[id],'good');break}
    case 'paper':return showPaper(S.news,today(),false);
    case 'paperN':if(pay(50))return showPaper(S.newsNext,today()+1,true);break;
    case 'qyes':{const [k,pod]=id.split('|');return questYes(k,pod)}
    case 'qno':S.podDay[id]=today();closeRPG();return;
    case 'qcancel':S.quest=null;S.carry=null;S.rep=Math.max(0,S.rep-1);closeRPG();toast('Отказался помогать. −1 репутации.');return;
    case 'qbuy':{const [tid,v,p,ci]=id.split('|');const t=tplOf(tid);if(!room(tid)){toast(roomMsg(tid),'bad');break}if(pay(+p)){S.stats.life-=+p;S.stats.spent+=+p;S.inv.unshift(newItem(t,ci?+ci:1,+v,{paid:+p}));toast(`📦 ${t.n} — на стеллаже.`,'good');log(`Купил у соседей ${t.n} за ${fmt(+p)} ₽`)}closeRPG();return}
    case 'sleep':closeAll();return sleepNow(true);
    case 'nap':closeAll();return sleepNow(false);
    case 'car':{const n=TR[S.car+1];if(n&&S.money>=n.cost){S.money-=n.cost;S.car++;mood(20);toast(`🚙 Теперь у тебя ${n.n}! Стоит во дворе.`,'good');log(`Транспорт: ${n.n}`)}break}
    case 'repay':{const p=Math.min(S.money,S.debt);S.money-=p;S.debt-=p;if(S.debt<=0){S.debt=0;S.debtDays=0;S.stats.repaid++;mood(15);toast('🧾 Долг погашен. Можно выдохнуть.','good')}else toast(`Погашено ${fmt(p)} ₽. Осталось ${fmt(S.debt)} ₽.`);break}
    case 'loan':{const amt=LOAN[S.ch]-S.debt;if(amt>0){S.money+=amt;S.debt+=round(amt*1.15);toast(`💸 «Быстроденьги» выдали ${fmt(amt)} ₽. Долг ${fmt(S.debt)} ₽, +8% в день.`,'bad');log(`Микрозайм ${fmt(amt)} ₽`)}break}
    case 'reset':openDlg('reset',`<div class="dw"><div class="tb"><span>СБРОС</span><button data-act="dlgx">×</button></div><div class="dc"><p class="wp">Деньги, стеллаж, курсы и сюжет сбросятся. Точно?</p><button class="wbtn dk" data-act="reset2">Да, начать заново</button> <button class="wbtn" data-act="dlgx">Отмена</button></div></div>`);return;
    case 'reset2':S=DEF();S.news=genNews(1);S.newsNext=genNews(2);save();closeDlg();closeAll();setScene('home',64,112,true);quiet=true;for(let i=0;i<5;i++)spawnOffer();quiet=false;S.introShown=true;S.newsRead=1;chapterStory(0);break;
  }
  refresh();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.dlg){closeDlg();refresh()}else if(ui.rpg){closeRPG()}else if(ui.os&&ui.app){ui.app=null;renderOS()}else if(ui.os){ui.os=false;renderOS()}}
  if((e.key===' '||e.key==='Enter')&&storyOpen){e.preventDefault();storyTap()}});
function refresh(){hud();if(ui.os)renderOS();if(ui.rpg)renderRPG();dirty=false;save()}
function live(){
  for(const o of S.offers){const e=document.querySelector(`[data-o="${o.id}"] .tl i`);if(e)e.style.width=(o.ttl/o.max*100)+'%'}
  for(const c of S.chats){const e=document.querySelector(`[data-ct="${c.id}"]`);if(e)e.style.width=(c.ttl/c.max*100)+'%'}
  for(const o of S.orders){const e=document.querySelector(`[data-ot="${o.id}"]`);if(e)e.style.width=(o.ttl/o.max*100)+'%'}
  for(const it of S.inv){const e=document.querySelector(`[data-views="${it.id}"]`);if(e)e.textContent=it.views}
  const tm=document.querySelector('#os .tm');if(tm)tm.textContent=hhmm(clock());
  const bl=document.querySelector('#os .bal');if(bl)bl.textContent='💰 '+fmtS(S.money)+' ₽';
  if(ui.rpg==='casino'){const cb=document.querySelector('.cbal b');if(cb&&!casSpin)cb.textContent=fmt(S.money)+' ₽'}
}
function tick(){
  if(storyOpen||ui.dlg==='paper'){hud();save();return}
  step();checkCrisis();dailyTick();hud();
  if(dirty&&!holding&&ui.dlg!=='price'&&ui.rpg!=='npc'){if(ui.os)renderOS();if(ui.rpg)renderRPG();dirty=false}else live();
  save();
}
function start(){
  resize();
  sndUI();$('coin').src=ICO.coin;$('phicon').src=ICO.phone;
  if(S.scene!=='home'){me.x=64;me.y=80}
  if(S.offers.length<3){quiet=true;for(let i=0;i<5;i++)spawnOffer();quiet=false}
  hud();requestAnimationFrame(loop);
  if(!S.introShown){S.introShown=true;S.newsRead=1;chapterStory(0)}
  setInterval(tick,1000);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start();
})();
</script>
</body></html>
